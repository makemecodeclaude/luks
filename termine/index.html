<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LUKS Terminradar</title>
  <meta name="description" content="Interne Terminübersicht des Luzerner Kantonsspitals: Tagesübersicht, freie Slots, Warteliste, Verzugsanzeige und Kennzahlen. Prototyp mit fiktiven Daten.">
  <meta name="theme-color" content="#1C5E85">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/termine.css">
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>

  <header class="topbar">
    <button class="tb-icon" id="tb-apps" aria-label="Spital-Anwendungen"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/></svg></button>
    <a class="tb-brand" href="#kalender"><span class="brand-mark"></span><span class="tb-name"><b>LUKS</b> Terminradar</span></a>
    <div class="tb-search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Suchen: Name, Patienten- oder Terminnummer" autocomplete="off" aria-label="Suchen">
      <div class="q-res" id="q-res" hidden></div>
    </div>
    <div class="tb-r">
      <button class="tb-chip" id="tb-clock"></button>
      <span class="tb-chip sync" id="tb-sync" title="Termindaten werden laufend aus LUKiS gelesen"></span>
      <button class="tb-icon" id="tb-bell" aria-label="Benachrichtigungen"></button>
      <button class="tb-icon" id="tb-gear" aria-label="Einstellungen"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
      <button class="tb-icon" id="tb-lock" aria-label="Arbeitsplatz sperren"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <button class="tb-user" id="tb-user" aria-haspopup="true" aria-label="Benutzer und Rolle"></button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Module"></nav>
    <div class="work">
      <div class="ribbon" id="ribbon"></div>
      <div class="body">
        <aside class="side" id="side" aria-label="Kalender und Navigation"></aside>
        <div class="side-scrim" id="side-scrim"></div>
        <main class="main" id="main" tabindex="-1"></main>
        <aside class="peek" id="peek" hidden aria-label="Termindetails"></aside>
      </div>
    </div>
  </div>

  <div class="pop notif-pop" id="notif-panel" hidden></div>
  <div class="pop user-pop" id="user-menu" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="lock" id="lock" hidden></div>

  <noscript><p style="padding:24px">Das Terminradar braucht JavaScript.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
